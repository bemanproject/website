[build]
command = "bash scripts/netlify-build.sh"
publish = "build"

# Library repositories are cloned by run-staged-website.py instead of Git
# submodules, so Netlify should not attempt its default submodule checkout.
[build.environment]
GIT_SUBMODULE_STRATEGY = "none"
