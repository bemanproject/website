# Dependabot version updates for the website. See the documentation for all
# configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - actions/*
          - github/*
      github-owned-actions:
        patterns:
          - actions/*
          - github/*
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    groups:
      npm:
        patterns:
          - "*"
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    groups:
      pip:
        patterns:
          - "*"
    schedule:
      interval: weekly
